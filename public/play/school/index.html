  for(var x=90;x<=630;x+=30){ var s = -Math.abs(x - cx)*0.15;
    objs.forEach(function(o){ if(o.done) return; var ahead = o.d - dist; if(ahead < -40 || ahead > 700) return; var dx = Math.abs(o.x - x), w = 1 - ahead/900;
