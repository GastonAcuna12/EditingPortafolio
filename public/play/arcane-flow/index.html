function collideSeg(c, a, b){

    for(j=0;j<segs.length;j++) collideSeg(c, segs[j][0], segs[j][1]);
    for(j=1;j<stroke.length;j++) collideSeg(c, stroke[j-1], stroke[j]);

    var a = coins[i]; if(!a.alive) continue;

// ================= Update =================
function update(dt){
  now += dt;
  updateTweens(dt);
  if(state === 'draw') idleT += dt;
  if(DEMO) demoUpdate(dt);

  if(state === 'run' || state === 'fail'){
    if(state === 'run'){
      spawnAcc += dt;
      while(spawnAcc > 0.055 && spawned < lv.coins){
        spawnAcc -= 0.055; spawned++;
        var nc = {x:lv.spout[0]+(Math.random()-0.5)*12, y:lv.spout[1]+20, vx:(Math.random()-0.5)*60, vy:260, alive:true, rot:Math.random()*6, spin:0, snd:0, k:(Math.random()*4)|0, s:0.2};
        coins.push(nc); to(nc, {s:1}, 220, EASE.back(2.4));

    }
    // fixed-step physics: identical behaviour at 30, 60 or 120 fps
    physAcc += dt; var guard = 0;
    while(physAcc >= PHYS_DT && guard++ < 24){ step(PHYS_DT); physAcc -= PHYS_DT; }
    var cx = lv.chest[0], top = lv.chest[1], hw = lv.chest[2]/2, alive = 0;
    for(var i=0;i<coins.length;i++){
      var c = coins[i]; if(!c.alive) continue;
      for(var k=0;k<lv.kills.length;k++){
        var z = lv.kills[k];
        if(c.x+R > z[0] && c.x-R < z[0]+z[2] && c.y+R > z[1] && c.y-R < z[1]+z[3]){
          c.alive = false; lastEvt = now; burst(c.x, c.y, '#ff3d7f', 8, 300, false); SFX.thorn(); shake = Math.max(shake, 4); break;
        }
      }
      if(!c.alive) continue;
      if(c.y > top+18 && Math.abs(c.x-cx) < hw){
        c.alive = false; collected++; total++; lastEvt = now;
        seq(chestA, [[{sx:1.12, sy:0.88}, 60, EASE.p2o], [{sx:1, sy:1}, 320, EASE.back(2.4)]]);
        seq(chestA, [[{lid:-0.2}, 60, EASE.p2o], [{lid:0}, 650, EASE.elastic(1, 0.35)]]);
        if(collected < lv.target) seq(counterA, [[{s:1.3}, 60, EASE.p2o], [{s:1}, 280, EASE.back(2)]]);
        burst(c.x, top+6, GEMS[c.k][0], 6, 360, true);
        parts.push({ t:'flash', x:c.x, y:top+4, life:0.22, max:0.22, col:GEMS[c.k][0], size:110, rot:Math.random()*3 });
        floats.push({x:c.x, y:top-10, t:0, s:'+1'});
        SFX.collect(collected-1);
        continue;
      }
      if(c.y > H+60){ c.alive = false; lastEvt = now; continue; }
      if((c.vx*c.vx + c.vy*c.vy) > 160000 && Math.random() < 0.12) parts.push({ t:'star', x:c.x, y:c.y, vx:0, vy:0, life:0.3, max:0.3, col:GEMS[c.k][0], size:22, g:0, rot:Math.random()*3 });
      alive++;
    }
    if(!won && collected >= lv.target){
      won = true; winT = now; shake = 16; flash = 0.5; SFX.win();
      seq(chestA, [[{sx:0.8, sy:1.24}, 90, EASE.p2o], [{sx:1.18, sy:0.86}, 110, EASE.p2o], [{sx:1, sy:1}, 760, EASE.elastic(1, 0.4)]]);
      seq(counterA, [[{s:1.6, r:-0.1}, 100, EASE.p2o], [{s:1, r:0}, 760, EASE.elastic(1, 0.4)]]);
      burst(cx, top, '#ffe680', 30, 820, true); burst(cx, top, '#6fe9ff', 14, 560, true); burst(cx, top, '#d08cff', 14, 560, true);
      ring(cx, top, '#ffe680', 1100, 0.7); ring(cx, top, '#d08cff', 700, 0.6);
      parts.push({ t:'magic', x:cx, y:top, life:1.0, max:1.0, col:'#ffd76a', size:420, rot:0 });
      if(navigator.vibrate) try{ navigator.vibrate(30); }catch(_){}
      setBanner(L < LEVELS.length-1 ? 'Awesome!' : 'Legendary!', '');
    }
    if(won && now - winT > 2.1){ if(L < LEVELS.length-1) load(L+1); else finish('win'); return; }
    if(!won && state === 'run' && spawned >= lv.coins && (alive === 0 || now - lastEvt > 3)){
      state = 'fail'; failT = now; fails++;
      setBanner('So close!', collected + ' / ' + lv.target);
      seq(counterA, [[{r:0.14}, 60, EASE.p2o], [{r:-0.12}, 90, EASE.sio], [{r:0.07}, 90, EASE.sio], [{r:0}, 320, EASE.p2o]]);
      seq(chestA, [[{sx:1.08, sy:0.88}, 140, EASE.p2o], [{sx:1, sy:1}, 520, EASE.back(1.6)]]);
      SFX.fail();
    }
    if(state === 'fail' && now - failT > 1.8){
      if(L === LEVELS.length-1 || fails >= 3) finish('fail'); else { resetLevel(); setBanner('Try again!', lv.name); }
    }
  }

  for(var p=parts.length-1;p>=0;p--){
    var q = parts[p]; q.life -= dt; if(q.life <= 0){ parts.splice(p,1); continue; }
    if(q.t === 'ring'){ q.r += q.vr*dt; q.vr *= Math.pow(0.12, dt); continue; }
    if(q.t === 'flash' || q.t === 'magic'){ q.rot += dt*1.5; continue; }

}

  window.__lv = LEVELS;
  window.__goto = function(i){ fails = 0; load(i); };
  window.__end = function(r){ finish(r || 'win'); };
  window.__cf = function(){ return { L:L, state:state, collected:collected, target:lv.target, spawned:spawned, total:total, result:result, ink:Math.round(inkUsed) }; };
}
function fontsReady(cb){
  var done = false; function go(){ if(!done){ done = true; cb(); } }
  setTimeout(go, 1500);
  try{ Promise.all(['900 40px Cinzel', '900 40px "Cinzel Decorative"', '40px "Lilita One"'].map(function(f){ return document.fonts.load(f); })).then(go, go); }catch(e){ go(); }
}
function start(){ loadVFX(function(){ fontsReady(function(){ load(0); if(location.hash === '#endcard') finish('win'); requestAnimationFrame(frame); }); }); }
if(window.mraid && mraid.getState && mraid.getState() === 'loading'){ mraid.addEventListener('ready', start); }
else start();
})();
</script>
